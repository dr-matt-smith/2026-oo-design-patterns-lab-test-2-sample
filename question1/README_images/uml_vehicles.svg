<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1510" viewBox="0 0 1300 1510"
     font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#000" stroke-width="2">

  <!-- white background so the diagram is readable in dark mode -->
  <rect x="0" y="0" width="1300" height="1510" fill="#fff" stroke="none"/>

  <!-- open arrowhead for dependency arrows -->
  <defs>
    <marker id="open-arrow" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20"
            markerUnits="userSpaceOnUse" orient="auto">
      <polyline points="2,2 18,10 2,18" fill="none" stroke="#000" stroke-width="2"/>
    </marker>
  </defs>

  <!-- ===== Diagram frame with heading tab ===== -->
  <g id="frame">
    <rect x="10" y="10" width="1280" height="1490"/>
    <polygon points="10,10 340,10 340,52 318,74 10,74" fill="#fff"/>
    <text x="26" y="54" font-size="28" fill="#000" stroke="none">cd/od: <tspan font-weight="bold">Question 1</tspan></text>
  </g>

  <!-- ================= Object diagram (from src/main.ts) ================= -->

  <!-- ===== main.ts (artifact = a source file, not a class) ===== -->
  <g id="main.ts">
    <rect x="485" y="100" width="330" height="110" fill="#d4f7c5"/>
    <!-- artifact "document" icon, top right -->
    <path d="M780,112 h14 l8,8 v22 h-22 z M794,112 v8 h8" fill="#fff" stroke-width="1.5"/>
    <text x="650" y="145" text-anchor="middle" font-size="24" fill="#000" stroke="none">«artifact»</text>
    <text x="650" y="186" text-anchor="middle" font-size="32" font-weight="bold" fill="#000" stroke="none">main.ts</text>
  </g>

  <!-- ===== car1 : Car ===== -->
  <g id="car1">
    <rect x="120" y="310" width="420" height="290" fill="#ccf6ff"/>
    <line x1="120" y1="375" x2="540" y2="375"/>
    <text x="330" y="354" text-anchor="middle" font-size="32" font-weight="bold" text-decoration="underline" fill="#000" stroke="none">car1 : Car</text>
    <g font-size="28" fill="#000" stroke="none">
      <text x="132" y="415">numDoors = 5</text>
      <text x="132" y="456">color = "Green"</text>
      <text x="132" y="497">price = 9999</text>
      <text x="132" y="538">kilometers = 50000</text>
      <text x="132" y="579">fuel = PETROL</text>
    </g>
  </g>

  <!-- ===== boat23 : Boat ===== -->
  <g id="boat23">
    <rect x="760" y="310" width="420" height="290" fill="#ccf6ff"/>
    <line x1="760" y1="375" x2="1180" y2="375"/>
    <text x="970" y="354" text-anchor="middle" font-size="32" font-weight="bold" text-decoration="underline" fill="#000" stroke="none">boat23 : Boat</text>
    <g font-size="28" fill="#000" stroke="none">
      <text x="772" y="415">horsepower = 1200</text>
      <text x="772" y="456">color = "Blue"</text>
      <text x="772" y="497">price = 5000</text>
      <text x="772" y="538">kilometers = 15000</text>
      <text x="772" y="579">fuel = DIESEL</text>
    </g>
  </g>

  <!-- ===== «create» dependencies: main.ts -> objects ===== -->
  <g id="creates" stroke-dasharray="10,7">
    <line x1="580" y1="210" x2="350" y2="310" marker-end="url(#open-arrow)"/>
    <line x1="720" y1="210" x2="950" y2="310" marker-end="url(#open-arrow)"/>
  </g>
  <g font-size="22" fill="#000" stroke="none">
    <text x="455" y="255" text-anchor="end">«create»</text>
    <text x="845" y="255">«create»</text>
  </g>

  <!-- ================= Class diagram (moved down as one group) ================= -->
  <g id="class-diagram" transform="translate(30,640)">

    <!-- ===== Vehicle (abstract) ===== -->
    <g id="Vehicle">
      <rect x="215" y="30" width="395" height="355" fill="#fff"/>
      <line x1="215" y1="163" x2="610" y2="163"/>
      <text x="412" y="76" text-anchor="middle" font-size="24" fill="#000" stroke="none">«abstract»</text>
      <text x="412" y="132" text-anchor="middle" font-size="36" font-weight="bold" font-style="italic" fill="#000" stroke="none">Vehicle</text>
      <g font-size="28" fill="#000" stroke="none">
        <text x="225" y="223">+color: String</text>
        <text x="225" y="264">+price: double</text>
        <text x="225" y="305">+kilometers: int</text>
        <text x="225" y="346">+fuel: FuelType = PETROL</text>
      </g>
    </g>

    <!-- ===== FuelType (enumeration) ===== -->
    <g id="FuelType">
      <rect x="840" y="30" width="385" height="355" fill="#fff"/>
      <line x1="840" y1="163" x2="1225" y2="163"/>
      <text x="1032" y="76" text-anchor="middle" font-size="24" fill="#000" stroke="none">«enumeration»</text>
      <text x="1032" y="132" text-anchor="middle" font-size="36" font-weight="bold" fill="#000" stroke="none">FuelType</text>
      <g font-size="28" fill="#000" stroke="none">
        <text x="850" y="223">PETROL = "PETROL"</text>
        <text x="850" y="264">DIESEL = "DIESEL"</text>
        <text x="850" y="305">ELECTRIC = "ELECTRIC"</text>
        <text x="850" y="346">HYBRID = "HYBRID"</text>
      </g>
    </g>

    <!-- ===== Car ===== -->
    <g id="Car">
      <rect x="10" y="575" width="565" height="175" fill="#fff"/>
      <line x1="10" y1="665" x2="575" y2="665"/>
      <text x="292" y="633" text-anchor="middle" font-size="36" font-weight="bold" fill="#000" stroke="none">Car</text>
      <text x="22" y="720" font-size="28" fill="#000" stroke="none">«get/set» -numDoors: integer</text>
    </g>

    <!-- ===== Boat ===== -->
    <g id="Boat">
      <rect x="655" y="575" width="460" height="245" fill="#fff"/>
      <line x1="655" y1="665" x2="1115" y2="665"/>
      <line x1="655" y1="750" x2="1115" y2="750"/>
      <text x="885" y="633" text-anchor="middle" font-size="36" font-weight="bold" fill="#000" stroke="none">Boat</text>
      <text x="667" y="720" font-size="28" fill="#000" stroke="none">«get» -horsepower: double</text>
      <!-- operations compartment: the constructor -->
      <text x="667" y="797" font-size="28" fill="#000" stroke="none">+Boat(horsepower: double)</text>
    </g>

    <!-- ===== Generalisation: Car, Boat -> Vehicle ===== -->
    <g id="inheritance">
      <polyline points="292,575 292,487 885,487 885,575"/>
      <line x1="412" y1="418" x2="412" y2="487"/>
      <!-- hollow triangle arrowhead pointing at the superclass -->
      <polygon points="412,385 388,418 436,418" fill="#fff"/>
    </g>
  </g>
</svg>
